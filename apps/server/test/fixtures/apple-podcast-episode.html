<script type="application/json" id="serialized-server-data">{"data":[{"data":{"shelves":[{},{"items":[{"text":" \u003cp>\u003cem>Watch along \u003c/em>\u003ca href=\"https://www.youtube.com/watch?v=akEqiXFo3GM\">\u003cem>AIE NYC\u003c/em>\u003c/a>\u003cem> and join us at \u003c/em>\u003ca href=\"https://ai.engineer/code/2026\">\u003cem>AIE CODE \u003c/em>\u003c/a>\u003cem>in SF next month!\u003c/em>\u003c/p>\u003cp>This episode includes a live demo of the Taku robot that \u003ca href=\"https://youtu.be/BHiYomkfoGQ?si=9w38VD0Qs699D-rH&amp;t=4631\">is best enjoyed on YouTube\u003c/a>.\u003c/p>\u003cp>Last month, Dyna made waves by announcing \u003cstrong>Dyna-2\u003c/strong>, a world-action model pre-trained on one million hours of human video, claiming several new scaling laws on human data across \u003ca href=\"https://x.com/DynaRobotics/status/2086857729105354778\">four orders of magnitude\u003c/a>. They have now followed up the model with a physical robot agent, \u003cstrong>Dyna-2.1\u003c/strong>, that has to be seen to be believed:\u003c/p>\u003cp>In his talk at AIE this year, Jason talked about how the real challenge for robotics in the real world is \u003ca href=\"https://www.youtube.com/watch?v=Sjfz1TqxzEs\">reliable, long-horizon autonomy\u003c/a>, and how Dyna got its models to a 99.4% success rate folding restaurant napkins for 24 hours straight, including recovering after it pulled over the whole stack.\u003c/p>\u003cp>From training a world-action model on over one million hours of human video to deploying robots that fold thousands of napkins daily at \u003ca href=\"https://x.com/DynaRobotics/status/2093039146357178475\">Din Tai Fung\u003c/a>, \u003ca href=\"https://www.dyna.co/\">\u003cstrong>Dyna Robotics\u003c/strong>\u003c/a>\u003ca href=\"https://www.dyna.co/\"> \u003c/a>is pushing physical AI beyond impressive demos and into real-world production. In this episode, Dyna Robotics co-founder and Chief Scientist \u003ca href=\"https://jasonma2016.github.io/\">\u003cstrong>Jason Ma\u003c/strong>\u003c/a> joins swyx on-site to unpack how robots can learn new tasks from as little as 45 minutes of demonstrations, why predicting the future of the physical world may be the key to general-purpose robotics, and what it actually takes to build robots that work reliably for real customers.\u003c/p>\u003cp>We go deep on Dyna-2, Dyna’s million-hour world-action model that combines future video prediction with robot actions, the scaling laws behind human-to-robot transfer, diffusion transformers and flow matching, and why synthetic environments and self-generated training data could unlock the next wave of robotics progress. Jason also explains why Dyna builds its own hardware instead of relying on off-the-shelf humanoids, how agentic harnesses enable robots to execute hour-long workflows, why dexterous hands and missing sensory data remain major bottlenecks, and what separates real commercial deployments from the graveyard of robotics startups. We also cover world-action models versus vision-language-action models, GPT-6 and coding agents in robotics, and Jason’s journey from AlphaGo and Penn to NVIDIA, Google DeepMind, and founding Dyna.\u003c/p>\u003cp>We discuss:\u003c/p>\u003cp>* Why \u003cstrong>Dyna-2\u003c/strong> was trained on over \u003cstrong>one million hours\u003c/strong> of human video\u003c/p>\u003cp>* \u003cstrong>World-action models:\u003c/strong> predicting future video to guide physical robot actions\u003c/p>\u003cp>* \u003cstrong>Diffusion transformers\u003c/strong>, flow matching, and real-time robotic control\u003c/p>\u003cp>* How robots learn new tasks with as little as \u003cstrong>45 minutes of demonstrations\u003c/strong>\u003c/p>\u003cp>* Why robotics has \u003cstrong>no equivalent of the internet\u003c/strong> and data remains its biggest scaling challenge\u003c/p>\u003cp>* \u003cstrong>Human egocentric video\u003c/strong>, robot demonstrations, and cross-embodiment transfer\u003c/p>\u003cp>* \u003cstrong>Synthetic environments\u003c/strong>, simulation, and models that generate their own training data\u003c/p>\u003cp>* Why robots need \u003cstrong>on-device inference\u003c/strong>, model distillation, and custom hardware\u003c/p>\u003cp>* Why Dyna chose \u003cstrong>wheeled semi-humanoids\u003c/strong> instead of traditional bipedal robots\u003c/p>\u003cp>* The hardware bottleneck: why \u003cstrong>dexterous robot hands\u003c/strong> still overheat\u003c/p>\u003cp>* \u003cstrong>Best Western, Din Tai Fung\u003c/strong>, and the difference between robotics pilots and scaled deployments\u003c/p>\u003cp>* \u003cstrong>The Bitter Lesson of Robotics:\u003c/strong> scaling data instead of engineering specialized solutions\u003c/p>\u003cp>* \u003cstrong>Agentic harnesses\u003c/strong> and robots executing multi-step, hour-long physical workflows\u003c/p>\u003cp>* \u003cstrong>GPT-6, coding agents\u003c/strong>, and AI-generated simulation environments for robotics research\u003c/p>\u003cp>* \u003cstrong>World-action models vs. VLAs\u003c/strong>, and why vision alone may not be enough\u003c/p>\u003cp>* Jason’s journey through \u003cstrong>AlphaGo, Penn, NVIDIA, Google DeepMind\u003c/strong>, and the Eureka project\u003c/p>\u003cp>* Dyna’s \u003cstrong>research culture\u003c/strong>, deployment-first philosophy, and vision for millions of robots\u003c/p>\u003cp>\u003cstrong>Jason Ma\u003c/strong>\u003c/p>\u003cp>* \u003cstrong>LinkedIn:\u003c/strong> \u003ca href=\"https://www.linkedin.com/in/jason-ma-742224a2/\">https://www.linkedin.com/in/jason-ma-742224a2/\u003c/a>\u003c/p>\u003cp>* \u003cstrong>X:\u003c/strong> \u003ca href=\"https://x.com/JasonMa2020\">https://x.com/JasonMa2020\u003c/a>\u003c/p>\u003cp>\u003cstrong>Dyna Robotics\u003c/strong>\u003c/p>\u003cp>* \u003cstrong>Website:\u003c/strong> \u003ca href=\"https://www.dyna.co/\">https://www.dyna.co/\u003c/a>\u003c/p>\u003cp>* \u003cstrong>X:\u003c/strong> \u003ca href=\"https://x.com/DynaRobotics\">https://x.com/DynaRobotics\u003c/a>\u003c/p>\u003cp>\u003cstrong>Timestamps\u003c/strong>\u003c/p>\u003cp>\u003cstrong>00:00:00\u003c/strong> Introduction and Dyna-2’s World-Action Model\u003c/p>\u003cp>\u003cstrong>00:03:08\u003c/strong> Diffusion Transformers, Flow Matching, and Generalist Robots\u003c/p>\u003cp>\u003cstrong>00:08:19\u003c/strong> The Robotics Data Bottleneck\u003c/p>\u003cp>\u003cstrong>00:13:50\u003c/strong> Synthetic Data and Self-Improving World Models\u003c/p>\u003cp>\u003cstrong>00:16:51\u003c/strong> Real-Time Inference and Model Distillation\u003c/p>\u003cp>\u003cstrong>00:19:45\u003c/strong> Full-Stack Robotics: Hardware and Supply Chains\u003c/p>\u003cp>\u003cstrong>00:25:02\u003c/strong> Why Dyna Built a Wheeled Semi-Humanoid\u003c/p>\u003cp>\u003cstrong>00:29:35\u003c/strong> Teaching Robots New Tasks and Evaluating Performance\u003c/p>\u003cp>\u003cstrong>00:31:59\u003c/strong> Autonomous Workflows and Hardware Limitations\u003c/p>\u003cp>\u003cstrong>00:36:06\u003c/strong> Real-World Deployments at Best Western and Din Tai Fung\u003c/p>\u003cp>\u003cstrong>00:41:07\u003c/strong> The Bitter Lesson of Robotics\u003c/p>\u003cp>\u003cstrong>00:46:13\u003c/strong> Agentic Harnesses for Physical AI\u003c/p>\u003cp>\u003cstrong>00:49:07\u003c/strong> GPT-6, Coding Agents, and AI-Native Robotics\u003c/p>\u003cp>\u003cstrong>00:52:02\u003c/strong> World-Action Models vs. VLAs\u003c/p>\u003cp>\u003cstrong>00:59:17\u003c/strong> From AlphaGo to Founding Dyna Robotics\u003c/p>\u003cp>\u003cstrong>01:04:20\u003c/strong> Dyna’s Research Culture and the Future of Robotics\u003c/p>\u003cp>Transcript\u003c/p>\u003cp>Introduction: Jason Ma and Dyna Robotics\u003c/p>\u003cp>\u003cstrong>Swyx [00:00:00]:\u003c/strong> All right, we’re here on site with Jason Ma, the co-founder, chief scientist of Dyna Robotics. Thanks for having us in your office.\u003c/p>\u003cp>\u003cstrong>Jason Ma [00:00:06]:\u003c/strong> Of course. Thank you for coming.\u003c/p>\u003cp>\u003cstrong>Vibhu [00:00:07]:\u003c/strong> It’s been a blast. We got to see—you’ll see plenty of B-roll—drinks being pulled, a lot of evals, robots with knives for the first time. So under the hood of all this you have a world action model. What is that?\u003c/p>\u003cp>Dyna-2: A World Action Model That Predicts the Future\u003c/p>\u003cp>\u003cstrong>Jason Ma [00:00:22]:\u003c/strong> So last month, we released our world action model called Dyna-2. So it’s the first world action model trained on more than one million hours of data. So going back to your question first, world action model is a model that’s able to predict the future video, the future state of the world, so hence the name world model. But in addition, you can also use that future generation to also produce actions robots can execute in the physical world to control the robot. So why do we do that? It’s a very powerful architecture, because if you think about how humans act in the physical world, in our brain, we are implicitly thinking about how the world will evolve based on our actions. So now we have a model architecture that’s able to do that to guide robot actions. So what we find is that by doing so, the model is much more dexterous, much more robust, and much more capable of generalizing to environments, to scenarios it’s never seen before.\u003c/p>\u003cp>World Action Models: Inputs, Outputs, and Visual Reasoning\u003c/p>\u003cp>\u003cstrong>Vibhu [00:01:17]:\u003c/strong> I wanna prompt this question a bit. I think a lot of people hear world model, and they think you’re outputting video or world or 3D state. You’re also doing action. I think most people don’t understand what models are under the hood of robotics. So what are the inputs and outputs? What’s the training data? What is the architecture? Give us all the details.\u003c/p>\u003cp>\u003cstrong>Jason Ma [00:01:39]:\u003c/strong> So, for inputs, the most important input is video, right? You can think about videos that the robot is capturing with its cameras, right? So video or images of the past many seconds, that’s the input. But for robots, what’s really interesting is that robot also has a lot of actuators and joint encoders on itself. So the robot also knows, the angles of its joints. So those can also be inputs to this world model. That’s something that’s very different from just a pure video model that’s only looking at videos, right? So that’s the input. And additionally, for robots, you want to be able to talk to it, to instruct it to do different tasks, right? So you can also feed it language instruction. So those are what I consider the basic set of inputs that go into any robotics models, including world action models. And once we have that the output, at the basic level, it needs to output actions the robots can execute on the hardware. But in the case of world action model, what’s really interesting is that in addition to the actions, it can also output future video, right? So basically, you can almost output the future video or some representation of it first, and then use that to guide robot actions. So the way I think about it is this is kind of analogous to chain of thought, you know. And basically, the models are reasoning in the visual, the physics space, and then outputting actions. So that’s the key difference between wo"}]}]}}]}</script>
